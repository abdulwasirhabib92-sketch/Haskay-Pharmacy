class SupabaseManager {
    constructor() {
        this.client = null;
        this.isOffline = !navigator.onLine;
        
        // Dynamic Variable Checking: Merges build environments or falls back safely
        const rawUrl = (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_URL) || window.APP_CONFIG?.VITE_SUPABASE_URL;
        const rawKey = (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_ANON_KEY) || window.APP_CONFIG?.VITE_SUPABASE_ANON_KEY;

        this.url = rawUrl ? rawUrl.trim() : '';
        this.key = rawKey ? rawKey.trim() : '';
        
        this.isLocalMode = !this.url || !this.key;
        this.syncQueue = JSON.parse(localStorage.getItem('haskay_sync_queue') || '[]');
        this.loadPromise = this.init(); 
        
        window.addEventListener('online', () => this.handleOnline());
        window.addEventListener('offline', () => this.handleOffline());
    }

    async init() {
        if (this.isLocalMode) {
            this.showBanner('Local Mode: Supabase not configured. All data stored locally.');
            return;
        }
        try {
            if (!window.supabase) {
                console.log('Preloaded Supabase client missing. Initializing runtime script load fallback...');
                await this.loadSupabaseScript();
            }
            
            this.client = window.supabase.createClient(this.url, this.key, { 
                auth: { persistSession: true, autoRefreshToken: true } 
            });
            
            // Check connectivity validation right out of the box
            const { error: pingError } = await this.client.auth.getSession();
            if (pingError) throw pingError;

            console.log('Supabase client successfully initialized and verified live cloud connection!');
            this.isLocalMode = false;
            
            // Explicitly force hide banner on successful cloud handshakes
            const banner = document.getElementById('offline-banner');
            if (banner) banner.classList.add('hidden');
            
            this.handleOnline();
        } catch (e) {
            console.error('Supabase initialization failure:', e.message);
            this.isLocalMode = true;
            this.showBanner('Local Mode: Could not connect to Supabase. Operating offline.');
        }
    }

    loadSupabaseScript() {
        return new Promise((resolve, reject) => {
            if (window.supabase) return resolve();
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js';
            script.async = true;
            script.onload = resolve;
            script.onerror = () => reject(new Error('CDN script resource download failed'));
            setTimeout(() => reject(new Error("CDN timing out")), 10000);
            document.head.appendChild(script);
        });
    }

    showBanner(text) {
        const banner = document.getElementById('offline-banner');
        if (!banner) return;
        document.getElementById('banner-text').textContent = text;
        banner.classList.remove('hidden');
        setTimeout(() => banner.classList.add('animate-slide-in'), 10);
    }

    handleOnline() {
        this.isOffline = false;
        if (!this.isLocalMode && this.client) {
            const banner = document.getElementById('offline-banner');
            if (banner) banner.classList.add('hidden');
            this.processSyncQueue();
        }
    }

    handleOffline() {
        this.isOffline = true;
        if (!this.isLocalMode) this.showBanner('You are offline. Changes queued for sync.');
    }

    queueOperation(table, operation, data) {
        const item = { id: crypto.randomUUID(), table, operation, data, timestamp: Date.now() };
        this.syncQueue.push(item);
        localStorage.setItem('haskay_sync_queue', JSON.stringify(this.syncQueue));
        return { data: { ...data, id: item.id, _queued: true }, error: null };
    }

    async processSyncQueue() {
        if (this.isLocalMode || !this.client || this.syncQueue.length === 0) return;
        const queue = [...this.syncQueue];
        this.syncQueue = [];
        localStorage.setItem('haskay_sync_queue', '[]');
        for (const item of queue) {
            try {
                if (item.operation === 'insert') await this.client.from(item.table).insert(item.data);
                else if (item.operation === 'update') await this.client.from(item.table).update(item.data).eq('id', item.data.id);
                App.showToast(`Synced: ${item.table}`, 'success');
            } catch (e) {
                console.error('Sync failed for item:', item, e);
                this.syncQueue.push(item);
            }
        }
        localStorage.setItem('haskay_sync_queue', JSON.stringify(this.syncQueue));
    }

    async signIn(email, password) {
        if (this.isLocalMode || this.isOffline || !this.client) return this.localSignIn(email, password);
        try {
            const { data, error } = await this.client.auth.signInWithPassword({ email, password });
            if (error) throw error;
            const { data: staff } = await this.client.from('staff').select('*').eq('user_id', data.user.id).single();
            return { user: { ...data.user, staff }, error: null };
        } catch (error) {
            return { user: null, error };
        }
    }

    async getSession() {
        if (this.isLocalMode || this.isOffline || !this.client) {
            const localSession = localStorage.getItem('haskay_local_session');
            return localSession ? { data: { session: JSON.parse(localSession) }, error: null } : { data: { session: null }, error: null };
        }
        try {
            return await this.client.auth.getSession();
        } catch(e) {
            console.warn('getSession failed:', e);
            return { data: { session: null }, error: e };
        }
    }

    async signOut() {
        localStorage.removeItem('haskay_local_session');
        if (!this.isLocalMode && this.client) await this.client.auth.signOut();
        return { error: null };
    }

    localSignIn(email, password) {
        const users = JSON.parse(localStorage.getItem('haskay_local_users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return { user: null, error: { message: 'Invalid credentials' } };
        const session = { user, expires_at: Date.now() + 86400000 };
        localStorage.setItem('haskay_local_session', JSON.stringify(session));
        return { user, error: null };
    }

    async select(table, query = {}) {
        if (this.isLocalMode || this.isOffline) {
            const data = JSON.parse(localStorage.getItem(`haskay_${table}`) || '[]');
            return { data, error: null };
        }
        let q = this.client.from(table).select(query.select || '*');
        if (query.eq) q = q.eq(query.eq[0], query.eq[1]);
        if (query.order) q = q.order(query.order[0], { ascending: query.order[1] === 'asc' });
        if (query.single) q = q.single();
        return await q;
    }

    async insert(table, data) {
        if (this.isLocalMode || this.isOffline) {
            const existing = JSON.parse(localStorage.getItem(`haskay_${table}`) || '[]');
            const newItem = { ...data, id: crypto.randomUUID(), created_at: new Date().toISOString() };
            existing.push(newItem);
            localStorage.setItem(`haskay_${table}`, JSON.stringify(existing));
            return this.isOffline && !this.isLocalMode ? this.queueOperation(table, 'insert', newItem) : { data: newItem, error: null };
        }
        return await this.client.from(table).insert(data).select();
    }

    async update(table, id, data) {
        if (this.isLocalMode || this.isOffline) {
            const existing = JSON.parse(localStorage.getItem(`haskay_${table}`) || '[]');
            const idx = existing.findIndex(i => i.id === id);
            if (idx > -1) existing[idx] = { ...existing[idx], ...data, updated_at: new Date().toISOString() };
            localStorage.setItem(`haskay_${table}`, JSON.stringify(existing));
            return this.isOffline && !this.isLocalMode ? this.queueOperation(table, 'update', existing[idx]) : { data: existing[idx], error: null };
        }
        return await this.client.from(table).update(data).eq('id', id).select();
    }
}

const DB = new SupabaseManager();

const App = {
    state: { user: null, route: '/', loading: true, currentFormTemplate: null },

    async init() {
        this.state.loading = true;
        window.addEventListener('hashchange', () => this.router());
        this.state.loading = false;
        try {
            await Promise.race([DB.loadPromise, new Promise(r => setTimeout(r, 3000))]);
            const { data } = await DB.getSession();
            if (data && data.session) {
                this.state.user = data.session.user;
                await this.loadInitialData();
            }
        } catch(e) { console.warn('Session check failed:', e); }
        this.router();
    },

    async loadInitialData() {
        const { data: template } = await DB.select('form_templates', { eq: ['active', true], single: true });
        this.state.currentFormTemplate = template || this.getDefaultTemplate();
    },

    getDefaultTemplate() {
        return {
            id: 'local-default',
            name: 'Default Patient Form',
            fields_json: [
                { name: 'full_name', label: 'Full Name', type: 'text', required: true },
                { name: 'dob', label: 'Date of Birth', type: 'date', required: true },
                { name: 'phone', label: 'Phone Number', type: 'tel', required: true },
                { name: 'address', label: 'Address', type: 'textarea', required: false },
                { name: 'notes', label: 'Clinical Notes', type: 'textarea', required: false }
            ]
        };
    },

    router() {
        this.state.route = window.location.hash.slice(1) || '/';
        if (!this.state.user && this.state.route !== '/login') { window.location.hash = '/login'; return; }
        if (this.state.user && this.state.route === '/login') { window.location.hash = '/dashboard'; return; }
        this.render();
    },

    render() {
        const app = document.getElementById('app');
        if (this.state.loading) { app.innerHTML = this.loadingScreen(); return; }
        if (!this.state.user) { app.innerHTML = this.loginPage(); this.attachLoginHandlers(); return; }
        app.innerHTML = `
            <div class="flex min-h-screen">
                ${this.sidebar()}
                <main class="flex-1 overflow-x-hidden">
                    <div class="p-4 md:p-8 max-w-7xl mx-auto animate-slide-in">
                        ${this.getPageContent()}
                    </div>
                </main>
            </div>
        `;
        this.attachPageHandlers();
    },

    getPageContent() {
        const pages = {
            '/dashboard': this.dashboardPage(),
            '/patients': this.patientsPage(),
            '/patients/new': this.patientFormPage(),
            '/expenses': this.expensesPage(),
            '/expenses/new': this.expenseFormPage(),
            '/attendance': this.attendancePage()
        };
        return pages[this.state.route] || this.dashboardPage();
    },

    sidebar() {
        const isAdmin = this.state.user?.staff?.role === 'admin' || this.state.user?.role === 'admin';
        const navItems = [
            { route: '/dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
            { route: '/patients', label: 'Patients', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
            { route: '/expenses', label: 'Expenses', icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
            { route: '/attendance', label: 'Attendance', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' }
        ];
        return `
            <aside class="hidden md:flex md:flex-col w-64 bg-white border-r border-slate-200 shadow-sm">
                <div class="p-6 border-b border-slate-200">
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-primary-600 to-emerald-600 bg-clip-text text-transparent">Haskay Pharmacy</h1>
                    <p class="text-xs text-slate-500 mt-1">${this.state.user?.email || ''}</p>
                </div>
                <nav class="flex-1 p-4 space-y-1">
                    ${navItems.map(item => `
                        <a href="#${item.route}" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${this.state.route.startsWith(item.route) ? 'bg-primary-50 text-primary-700 font-medium' : 'text-slate-600 hover:bg-slate-50'}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${item.icon}"></path></svg>
                            ${item.label}
                        </a>
                    `).join('')}
                </nav>
            </aside>
            ${this.mobileNav(navItems)}
        `;
    },

    mobileNav(navItems) {
        return `
            <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 glass">
                <div class="flex justify-around py-2">
                    ${navItems.map(item => `
                        <a href="#${item.route}" class="flex flex-col items-center gap-1 px-3 py-2 rounded-lg ${this.state.route.startsWith(item.route) ? 'text-primary-600' : 'text-slate-500'}">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${item.icon}"></path></svg>
                            <span class="text-xs">${item.label}</span>
                        </a>
                    `).join('')}
                </div>
            </nav>
        `;
    },

    loadingScreen() { return `<div class="min-h-screen flex items-center justify-center"><div class="spinner"></div></div>`; },
    loginPage() { return `<div class="min-h-screen flex items-center justify-center"><form id="login-form" class="bg-white p-8 rounded shadow-md max-w-md w-full mx-4"><h3 class="text-xl font-bold mb-4 text-center text-slate-800">Staff Secure Portal</h3><input type="email" id="email" required class="border border-slate-200 p-3 rounded mb-3 block w-full bg-slate-50" placeholder="Email"><input type="password" id="password" required class="border border-slate-200 p-3 rounded mb-5 block w-full bg-slate-50" placeholder="Password"><button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white p-3 font-semibold rounded w-full transition-all shadow-md">Login</button></form></div>`; },
    dashboardPage() { return `<div class="p-4"><h2 class="text-2xl font-bold text-slate-800">Dashboard Working Ready</h2></div>`; },
    patientsPage() { return `<div class="p-4"><h2 class="text-2xl font-bold text-slate-800">Patients Management</h2></div>`; },
    patientFormPage() { return `<div class="p-4"><h2 class="text-2xl font-bold text-slate-800">Add Patient</h2></div>`; },
    expensesPage() { return `<div class="p-4"><h2 class="text-2xl font-bold text-slate-800">Expenses Overhead Log</h2></div>`; },
    expenseFormPage() { return `<div class="p-4"><h2 class="text-2xl font-bold text-slate-800">Log New Expense</h2></div>`; },
    
    attendancePage() { 
        return `
            <div class="space-y-6 pb-20 md:pb-0">
                <h2 class="text-3xl font-bold text-slate-900">Attendance Log</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="text-center py-12">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-primary-100 rounded-full mb-4">
                            <svg class="w-10 h-10 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <p class="text-slate-600">Attendance features ready to process.</p>
                    </div>
                </div>
            </div>`; 
    },

    showToast(message, type) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const div = document.createElement('div');
        div.className = `p-4 rounded-lg shadow-lg text-white font-medium animate-slide-in ${type === 'success' ? 'bg-emerald-500' : 'bg-rose-500'}`;
        div.textContent = message;
        container.appendChild(div);
        setTimeout(() => div.remove(), 4000);
    },

    attachLoginHandlers() {
        document.getElementById('login-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { user, error } = await DB.signIn(email, password);
            if (error) alert(error.message);
            else window.location.hash = '/dashboard';
        });
    },
    attachPageHandlers() {}
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
