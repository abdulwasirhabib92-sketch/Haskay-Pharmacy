// ==================== SUPABASE LOADER WITH FALLBACK ====================
class SupabaseManager {
    constructor() {
        this.client = null;
        this.isOffline = !navigator.onLine;
        this.isLocalMode = !window.APP_CONFIG.VITE_SUPABASE_URL || !window.APP_CONFIG.VITE_SUPABASE_ANON_KEY;
        this.loadPromise = this.init();
        this.syncQueue = JSON.parse(localStorage.getItem('haskay_sync_queue') || '[]');
        window.addEventListener('online', () => this.handleOnline());
        window.addEventListener('offline', () => this.handleOffline());
    }

    async init() {
        // Show loading screen immediately
        document.getElementById("app").innerHTML = this.loadingScreen();
        window.addEventListener("hashchange", () => this.router());
        if (this.isLocalMode) {
            this.showBanner('Local Mode: Supabase not configured. All data stored locally.');
            return;
        }
        try {
            await this.loadSupabaseScript();
            this.client = window.supabase.createClient(
                window.APP_CONFIG.VITE_SUPABASE_URL,
                window.APP_CONFIG.VITE_SUPABASE_ANON_KEY,
                { auth: { persistSession: true, autoRefreshToken: true } }
            );
            this.handleOnline();
        } catch (e) {
            console.warn('Supabase CDN failed, falling back to Local Mode:', e);
            this.isLocalMode = true;
            this.showBanner('Local Mode: Could not connect to Supabase. Operating offline.');
        }
    }

    loadSupabaseScript() {
        return new Promise((resolve, reject) => {
            if (window.supabase) return resolve();
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js';
            script.async = true;
            script.onload = resolve;
            script.onerror = () => reject(new Error('CDN load failed'));
            setTimeout(() => reject(new Error("CDN timeout")), 10000);
            document.head.appendChild(script);
        });
    }

    showBanner(text) {
        const banner = document.getElementById('offline-banner');
        document.getElementById('banner-text').textContent = text;
        banner.classList.remove('hidden');
        setTimeout(() => banner.classList.add('animate-slide-in'), 10);
    }

    handleOnline() {
        this.isOffline = false;
        if (!this.isLocalMode && this.client) {
            document.getElementById('offline-banner').classList.add('hidden');
            this.processSyncQueue();
        }
    }

    handleOffline() {
        this.isOffline = true;
        if (!this.isLocalMode) this.showBanner('You are offline. Changes queued for sync.');
    }

    queueOperation(table, operation, data) {
        const item = { id: crypto.randomUUID(), table, operation, data, timestamp: Date.now() };
        this.syncQueue.push(item);
        localStorage.setItem('haskay_sync_queue', JSON.stringify(this.syncQueue));
        return { data: { ...data, id: item.id, _queued: true }, error: null };
    }

    async processSyncQueue() {
        if (this.isLocalMode || !this.client || this.syncQueue.length === 0) return;
        const queue = [...this.syncQueue];
        this.syncQueue = [];
        localStorage.setItem('haskay_sync_queue', '[]');
        for (const item of queue) {
            try {
                if (item.operation === 'insert') await this.client.from(item.table).insert(item.data);
                else if (item.operation === 'update') await this.client.from(item.table).update(item.data).eq('id', item.data.id);
                App.showToast(`Synced: ${item.table}`, 'success');
            } catch (e) {
                console.error('Sync failed for item:', item, e);
                this.syncQueue.push(item);
            }
        }
        localStorage.setItem('haskay_sync_queue', JSON.stringify(this.syncQueue));
    }

    async signIn(email, password) {
        if (this.isLocalMode || this.isOffline) return this.localSignIn(email, password);
        try {
            const { data, error } = await this.client.auth.signInWithPassword({ email, password });
            if (error) throw error;
            const { data: staff } = await this.client.from('staff').select('*').eq('user_id', data.user.id).single();
            return { user: { ...data.user, staff }, error: null };
        } catch (error) {
            return { user: null, error };
        }
    }

    async getSession() {
        if (this.isLocalMode || this.isOffline) {
            const localSession = localStorage.getItem('haskay_local_session');
            return localSession ? { data: { session: JSON.parse(localSession) }, error: null } : { data: { session: null }, error: null };
        }
        return await this.client.auth.getSession();
    }

    async signOut() {
        localStorage.removeItem('haskay_local_session');
        if (!this.isLocalMode && this.client) await this.client.auth.signOut();
        return { error: null };
    }

    localSignIn(email, password) {
        const users = JSON.parse(localStorage.getItem('haskay_local_users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return { user: null, error: { message: 'Invalid credentials' } };
        const session = { user, expires_at: Date.now() + 86400000 };
        localStorage.setItem('haskay_local_session', JSON.stringify(session));
        return { user, error: null };
    }

    async select(table, query = {}) {
        if (this.isLocalMode || this.isOffline) {
            const data = JSON.parse(localStorage.getItem(`haskay_${table}`) || '[]');
            return { data, error: null };
        }
        let q = this.client.from(table).select(query.select || '*');
        if (query.eq) q = q.eq(query.eq[0], query.eq[1]);
        if (query.order) q = q.order(query.order[0], { ascending: query.order[1] === 'asc' });
        if (query.single) q = q.single();
        return await q;
    }

    async insert(table, data) {
        if (this.isLocalMode || this.isOffline) {
            const existing = JSON.parse(localStorage.getItem(`haskay_${table}`) || '[]');
            const newItem = { ...data, id: crypto.randomUUID(), created_at: new Date().toISOString() };
            existing.push(newItem);
            localStorage.setItem(`haskay_${table}`, JSON.stringify(existing));
            return this.isOffline && !this.isLocalMode ? this.queueOperation(table, 'insert', newItem) : { data: newItem, error: null };
        }
        return await this.client.from(table).insert(data).select();
    }

    async update(table, id, data) {
        if (this.isLocalMode || this.isOffline) {
            const existing = JSON.parse(localStorage.getItem(`haskay_${table}`) || '[]');
            const idx = existing.findIndex(i => i.id === id);
            if (idx > -1) existing[idx] = { ...existing[idx], ...data, updated_at: new Date().toISOString() };
            localStorage.setItem(`haskay_${table}`, JSON.stringify(existing));
            return this.isOffline && !this.isLocalMode ? this.queueOperation(table, 'update', existing[idx]) : { data: existing[idx], error: null };
        }
        return await this.client.from(table).update(data).eq('id', id).select();
    }
}

                    <h2 class="text-3xl font-bold text-slate-900">Patients</h2>
                    <a href="#/patients/new" class="inline-flex items-center gap-2 bg-gradient-to-r from-primary-600 to-emerald-600 text-white font-semibold px-5 py-3 rounded-lg shadow-lg hover:shadow-xl transition-all card-hover">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        New Patient
                    </a>
                </div>
                <div id="patients-list" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 text-center text-slate-500">Loading patients...</div>
                </div>
            </div>
        `;
    },

    patientFormPage() {
        const fields = this.state.currentFormTemplate.fields_json;
        return `
            <div class="max-w-3xl mx-auto space-y-6 pb-20 md:pb-0">
                <div class="flex items-center gap-4">
                    <a href="#/patients" class="p-2 hover:bg-slate-100 rounded-lg transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <h2 class="text-3xl font-bold text-slate-900">${this.state.currentFormTemplate.name}</h2>
                </div>
                <form id="patient-form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                    ${fields.map(f => this.renderFormField(f)).join('')}
                    <div class="flex gap-3 pt-4">
                        <button type="submit" class="flex-1 bg-gradient-to-r from-primary-600 to-emerald-600 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl transition-all card-hover">Save Patient Record</button>
                        <a href="#/patients" class="px-6 py-3 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50 transition-all">Cancel</a>
                    </div>
                </form>
            </div>
        `;
    },

    renderFormField(field) {
        const baseClasses = "w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-primary-500 transition-all";
        const required = field.required ? 'required' : '';
        const requiredMark = field.required ? '<span class="text-red-500">*</span>' : '';
        let input = '';
        if (field.type === 'textarea') {
            input = `<textarea name="${field.name}" ${required} rows="4" class="${baseClasses}" placeholder="${field.placeholder || ''}"></textarea>`;
        } else if (field.type === 'select') {
            input = `<select name="${field.name}" ${required} class="${baseClasses}"><option value="">Select ${field.label}</option>${(field.options || []).map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
        } else {
            input = `<input type="${field.type}" name="${field.name}" ${required} class="${baseClasses}" placeholder="${field.placeholder || ''}">`;
        }
        return `<div><label class="block text-sm font-medium text-slate-700 mb-2">${field.label} ${requiredMark}</label>${input}</div>`;
    },

    expensesPage() {
        return `
            <div class="space-y-6 pb-20 md:pb-0">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <h2 class="text-3xl font-bold text-slate-900">Expenses</h2>
                    <a href="#/expenses/new" class="inline-flex items-center gap-2 bg-gradient-to-r from-primary-600 to-emerald-600 text-white font-semibold px-5 py-3 rounded-lg shadow-lg hover:shadow-xl transition-all card-hover">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Log Expense
                    </a>
                </div>
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 text-sm text-amber-800"><strong>Note:</strong> Log only overhead expenses. No expense presets per requirements.</div>
                <div id="expenses-list" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 text-center text-slate-500">Loading expenses...</div>
                </div>
            </div>
        `;
    },

    expenseFormPage() {
        return `
            <div class="max-w-2xl mx-auto space-y-6 pb-20 md:pb-0">
                <div class="flex items-center gap-4">
                    <a href="#/expenses" class="p-2 hover:bg-slate-100 rounded-lg transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <h2 class="text-3xl font-bold text-slate-900">Log Expense</h2>
                </div>
                <form id="expense-form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                    <div><label class="block text-sm font-medium text-slate-700 mb-2">Category <span class="text-red-500">*</span></label><input type="text" name="category" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-primary-500 transition-all" placeholder="e.g., Office Supplies, Utilities"></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-2">Amount <span class="text-red-500">*</span></label><input type="number" name="amount" step="0.01" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-primary-500 transition-all" placeholder="0.00"></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-2">Description</label><textarea name="description" rows="3" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-primary-500 transition-all" placeholder="Optional details"></textarea></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-2">Receipt Upload</label><input type="file" name="receipt" accept="image/*,.pdf" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-primary-500 transition-all"></div>
                    <div class="flex gap-3 pt-4">
                        <button type="submit" class="flex-1 bg-gradient-to-r from-primary-600 to-emerald-600 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl transition-all card-hover">Save Expense</button>
                        <a href="#/expenses" class="px-6 py-3 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50 transition-all">Cancel</a>
                    </div>
                </form>
            </div>
        `;
    },

    attendancePage() {
        return `
            <div class="space-y-6 pb-20 md:pb-0">
                <h2 class="text-3xl font-bold text-slate-900">Attendance</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
                    <div class="text-center py-12">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-primary-100 rounded-full mb-4">
                            <svg class="w-10 h-10 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <p class="text-2xl font-bold text-slate-900 mb-2" id="current-time">--:--</p>
                        <p class="text-slate-600 mb-6">Scheduled: 09:00 AM</p>
                        <button id="checkin-btn" class="bg-gradient-to-r from-primary-600 to-emerald-600 text-white font-semibold px-8 py-3 rounded-lg shadow-lg hover:shadow-xl transition-all card-hover">Check In</button>
                    </div>
                </div>
            </div>
        `;
    },

    adminPage() {
        return `
            <div class="space-y-6 pb-20 md:pb-0">
                <h2 class="text-3xl font-bold text-slate-900">Admin Panel</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <a href="#/admin/form-builder" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 card-hover transition-all">
                        <div class="flex items-center gap-4 mb-3"><div class="p-3 bg-primary-50 rounded-lg"><svg class="w-6 h-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div><h3 class="text-lg font-semibold text-slate-900">Form Builder</h3></div>
                        <p class="text-sm text-slate-600">Customize patient form fields to match hardcopy</p>
                    </a>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <div class="flex items-center gap-4 mb-3"><div class="p-3 bg-emerald-50 rounded-lg"><svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg></div><h3 class="text-lg font-semibold text-slate-900">Staff Management</h3></div>
                        <p class="text-sm text-slate-600 mb-4">Create staff via Vercel API with x-admin-key</p>
                        <button id="create-staff-demo" class="text-sm text-primary-600 font-medium hover:underline">View API Docs →</button>
                    </div>
                </div>
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 text-sm text-amber-800"><strong>Backend Setup Required:</strong> Deploy /api folder to Vercel with SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and ADMIN_API_KEY environment variables.</div>
            </div>
        `;
    },

    formBuilderPage() {
        const template = this.state.currentFormTemplate;
        return `
            <div class="space-y-6 pb-20 md:pb-0">
                <div class="flex items-center gap-4">
                    <a href="#/admin" class="p-2 hover:bg-slate-100 rounded-lg transition-all"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg></a>
                    <div><h2 class="text-3xl font-bold text-slate-900">Patient Form Builder</h2><p class="text-slate-600">Fully customizable to match hardcopy</p></div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
                    <div id="form-fields-list" class="space-y-4 mb-6">${template.fields_json.map((f, i) => this.formFieldEditor(f, i)).join('')}</div>
                    <div class="flex gap-3">
                        <button id="add-field-btn" class="px-5 py-2 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50 transition-all">+ Add Field</button>
                        <button id="save-template-btn" class="flex-1 bg-gradient-to-r from-primary-600 to-emerald-600 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl transition-all card-hover">Save Template</button>
                    </div>
                </div>
            </div>
        `;
    },

    formFieldEditor(field, index) {
        return `
            <div class="border border-slate-200 rounded-lg p-4 space-y-3" data-index="${index}">
                <div class="flex justify-between items-start gap-4">
                    <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" value="${field.label}" class="field-label px-3 py-2 rounded border border-slate-300" placeholder="Field Label">
                        <input type="text" value="${field.name}" class="field-name px-3 py-2 rounded border border-slate-300" placeholder="field_name">
                        <select class="field-type px-3 py-2 rounded border border-slate-300">
                            <option value="text" ${field.type === 'text' ? 'selected' : ''}>Text</option>
                            <option value="number" ${field.type === 'number' ? 'selected' : ''}>Number</option>
                            <option value="date" ${field.type === 'date' ? 'selected' : ''}>Date</option>
                            <option value="tel" ${field.type === 'tel' ? 'selected' : ''}>Phone</option>
                            <option value="email" ${field.type === 'email' ? 'selected' : ''}>Email</option>
                            <option value="textarea" ${field.type === 'textarea' ? 'selected' : ''}>Textarea</option>
                            <option value="select" ${field.type === 'select' ? 'selected' : ''}>Dropdown</option>
                        </select>
                        <label class="flex items-center gap-2 px-3 py-2"><input type="checkbox" class="field-required" ${field.required ? 'checked' : ''}><span class="text-sm text-slate-600">Required</span></label>
                    </div>
                    <button class="remove-field-btn p-2 text-red-600 hover:bg-red-50 rounded transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>
                ${field.type === 'select' ? `<input type="text" value="${(field.options || []).join(', ')}" class="field-options w-full px-3 py-2 rounded border border-slate-300" placeholder="Option 1, Option 2, Option 3">` : ''}
            </div>
        `;
    },

    attachLoginHandlers() {
        document.getElementById('login-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner mx-auto"></div>';
            const { user, error } = await DB.signIn(email, password);
            if (error) {
                this.showToast(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            } else {
                this.state.user = user;
                this.showToast('Welcome back!', 'success');
                window.location.hash = '/dashboard';
            }
        });
    },

    attachPageHandlers() {
        document.getElementById('logout-btn')?.addEventListener('click', async () => {
            await DB.signOut();
            this.state.user = null;
            window.location.hash = '/login';
            this.showToast('Signed out', 'info');
        });

        document.getElementById('patient-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data_json = Object.fromEntries(formData);
            await DB.insert('patients', { data_json, created_by: this.state.user.id });
            this.showToast('Patient record saved', 'success');
            window.location.hash = '/patients';
        });

        document.getElementById('expense-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            await DB.insert('expenses', { ...data, logged_by: this.state.user.id });
            this.showToast('Expense logged', 'success');
            window.location.hash = '/expenses';
        });

        document.getElementById('checkin-btn')?.addEventListener('click', async () => {
            this.showToast('Checked in at ' + new Date().toLocaleTimeString(), 'success');
            document.getElementById('checkin-btn').textContent = 'Check Out';
        });

        document.getElementById('create-staff-demo')?.addEventListener('click', () => {
            this.showToast('POST /api/admin/create-staff with x-admin-key header', 'info');
        });

        document.getElementById('add-field-btn')?.addEventListener('click', () => {
            const list = document.getElementById('form-fields-list');
            const newField = { name: 'new_field', label: 'New Field', type: 'text', required: false };
            list.insertAdjacentHTML('beforeend', this.formFieldEditor(newField, list.children.length));
            this.attachFieldEditorHandlers();
        });

        document.getElementById('save-template-btn')?.addEventListener('click', async () => {
            const fields = [];
            document.querySelectorAll('[data-index]').forEach(el => {
                const field = {
                    name: el.querySelector('.field-name').value,
                    label: el.querySelector('.field-label').value,
                    type: el.querySelector('.field-type').value,
                    required: el.querySelector('.field-required').checked
                };
                if (field.type === 'select') field.options = el.querySelector('.field-options')?.value.split(',').map(s => s.trim()) || [];
                fields.push(field);
            });
            this.state.currentFormTemplate.fields_json = fields;
            await DB.update('form_templates', this.state.currentFormTemplate.id, { fields_json: fields });
            this.showToast('Form template saved', 'success');
        });

        this.attachFieldEditorHandlers();
        this.updateCurrentTime();
        if (this.state.route === '/patients') this.loadPatients();
        if (this.state.route === '/expenses') this.loadExpenses();
    },

    attachFieldEditorHandlers() {
        document.querySelectorAll('.remove-field-btn').forEach(btn => {
            btn.onclick = (e) => e.target.closest('[data-index]').remove();
        });
    },

    async loadPatients() {
        const { data } = await DB.select('patients', { order: ['created_at', 'desc'] });
        const list = document.getElementById('patients-list');
        if (!data || data.length === 0) { list.innerHTML = '<div class="p-6 text-center text-slate-500">No patients yet. Add your first record.</div>'; return; }
        list.innerHTML = `<div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-50 border-b border-slate-200"><tr><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Name</th><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Phone</th><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Date Added</th></tr></thead><tbody class="divide-y divide-slate-200">${data.map(p => `<tr class="hover:bg-slate-50 transition-all"><td class="px-6 py-4 text-sm font-medium text-slate-900">${p.data_json.full_name || 'N/A'}</td><td class="px-6 py-4 text-sm text-slate-600">${p.data_json.phone || 'N/A'}</td><td class="px-6 py-4 text-sm text-slate-600">${new Date(p.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`;
    },

    async loadExpenses() {
        const { data } = await DB.select('expenses', { order: ['created_at', 'desc'] });
        const list = document.getElementById('expenses-list');
        if (!data || data.length === 0) { list.innerHTML = '<div class="p-6 text-center text-slate-500">No expenses logged yet.</div>'; return; }
        const total = data.reduce((sum, e) => sum + parseFloat(e.amount), 0);
        list.innerHTML = `<div class="p-6 border-b border-slate-200"><p class="text-sm text-slate-600">Total: <span class="text-2xl font-bold text-slate-900">$${total.toFixed(2)}</span></p></div><div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-50 border-b border-slate-200"><tr><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Date</th><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Category</th><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Amount</th><th class="px-6 py-3 text-left text-xs font-medium text-slate-700 uppercase">Description</th></tr></thead><tbody class="divide-y divide-slate-200">${data.map(e => `<tr class="hover:bg-slate-50 transition-all"><td class="px-6 py-4 text-sm text-slate-600">${new Date(e.date).toLocaleDateString()}</td><td class="px-6 py-4 text-sm font-medium text-slate-900">${e.category}</td><td class="px-6 py-4 text-sm font-semibold text-slate-900">$${parseFloat(e.amount).toFixed(2)}</td><td class="px-6 py-4 text-sm text-slate-600">${e.description || '-'}</td></tr>`).join('')}</tbody></table></div>`;
    },

    updateCurrentTime() {
        const el = document.getElementById('current-time');
        if (el) {
            const update = () => el.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            update();
            setInterval(update, 1000);
        }
    },

    showToast(message, type = 'info') {
        const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-primary-600', warning: 'bg-amber-600' };
        const toast = document.createElement('div');
        toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg animate-slide-in`;
        toast.textContent = message;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
};

if (!localStorage.getItem('haskay_local_users')) {
    localStorage.setItem('haskay_local_users', JSON.stringify([
        { id: '1', email: 'admin@haskay.com', password: 'admin123', staff: { role: 'admin', full_name: 'Admin User' } },
        { id: '2', email: 'staff@haskay.com', password: 'staff123', staff: { role: 'staff', full_name: 'Staff User' } }
    ]));
}

App.init();
</script>
